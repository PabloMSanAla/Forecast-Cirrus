name: forecast
channels:
  - conda-forge

dependencies:
  # Universal C/C++ Toolchain (Conda solver automatically selects clang on macOS, g++ on Linux)
  - cxx-compiler
  - c-compiler
  - make
  - cmake
  - parallel

  # Python, CLI & Postprocessing Requirements
  - python >=3.8
  - pip
  - pyyaml >=5.1
  - numpy >=1.20
  - pandas >=1.3
  - astropy >=4.3
  - tqdm >=4.60
  - requests >=2.25
  - psutil >=5.8

  # Core Linear Algebra & Math Libraries
  - gsl
  - openblas
  - lapack
  - fftw
  - eigen
  - armadillo
  - yaml-cpp

  # Astronomy & Scientific I/O Libraries
  - cfitsio
  - ccfits
  - hdf5

