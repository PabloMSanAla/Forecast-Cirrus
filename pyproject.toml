[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-sim"
version = "1.0.0"
description = "FORECAST - Cosmological Lightcone Synthesis and Post-Processing Pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=5.1",
]

[tool.setuptools]
script-files = ["bin/forecast"]
