[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-sim"
version = "1.0.0"
description = "FORECAST - Cosmological Lightcone Synthesis and Postprocessing Pipeline"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Pablo MSanAla / FORECAST Team"}
]
dependencies = [
    "pyyaml>=5.1",
    "numpy>=1.20",
    "pandas>=1.3",
    "astropy>=4.3",
    "tqdm>=4.60",
    "requests>=2.25",
    "psutil>=5.8",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
]

[project.scripts]
forecast = "forecast.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forecast*"]
